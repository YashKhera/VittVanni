<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Apply - VittVanni</title>
  <script>
    (function () {
      try {
        var t = JSON.parse(localStorage.getItem('vittvanni:theme'));
        document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/typography.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/accessibility.css">
  <link rel="stylesheet" href="/css/print.css">
  <style>
    .partner-pick{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--border,#e5e7eb);border-radius:12px;margin-bottom:10px;cursor:pointer}
    .partner-pick input{margin-top:4px}
    .success-check{width:84px;height:84px;margin:0 auto 16px;border-radius:50%;background:#16a34a;color:#fff;font-size:44px;line-height:84px;animation:popIn .5s cubic-bezier(.34,1.56,.64,1)}
    .success-check.denied{background:#dc2626}
    @keyframes popIn{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
  </style>
</head>
<body data-page="apply">
  <header id="navbar"></header>
  <main class="container" style="max-width:760px;padding-top:var(--space-5);padding-bottom:var(--space-7)">
    <div id="applyMount"></div>
  </main>
  <footer id="siteFooter"></footer>

  <script src="/js/services/storage.js"></script>
  <script src="/js/services/theme.js"></script>
  <script src="/js/i18n/translations.js"></script>
  <script src="/js/services/i18n.js"></script>
  <script src="/js/services/notifications.js"></script>
  <script src="/js/services/validation.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/components/navbar.js"></script>
  <script src="/js/components/footer.js"></script>
  <script src="/js/pages/apply.js"></script>
</body>
</html>
