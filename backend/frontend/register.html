<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Create account - VittVanni</title>
  <script>
    (function () {
      try {
        var t = JSON.parse(localStorage.getItem('vittvanni:theme'));
        document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/typography.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/accessibility.css">
  <link rel="stylesheet" href="/css/print.css">
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-5) var(--space-4);
    }
    .auth-card {
      width: 100%;
      max-width: 460px;
    }
    .auth-brand {
      display: block;
      text-align: center;
      font-size: var(--font-size-lg);
      font-weight: 700;
      margin-bottom: var(--space-4);
      color: var(--text-primary);
    }
    .auth-brand:hover { text-decoration: none; }
    .auth-header { text-align: center; margin-bottom: var(--space-5); }
    .auth-sub { color: var(--text-secondary); margin-bottom: 0; }
  </style>
</head>
<body data-page="register">
  <div class="auth-container">
    <div class="auth-card">
      <a href="/home" class="auth-brand"><span class="gradient-text" data-i18n="app.name">VittVanni</span></a>
      <div class="card fade-in-up">
        <div class="auth-header">
          <h2 class="mb-1" data-i18n="auth.register.title">Create your account</h2>
          <p class="auth-sub" data-i18n="auth.register.sub">Free forever. Register in seconds.</p>
        </div>

        <div id="formError" class="form-error hidden"></div>
        <div id="formNote" class="form-note hidden"></div>

        <div class="flex gap-2 mb-4" role="tablist" aria-label="Account type">
          <button type="button" id="tabUser" class="btn btn-secondary btn-sm flex-1" data-i18n="auth.register.type.user">Entrepreneur</button>
          <button type="button" id="tabPartner" class="btn btn-ghost btn-sm flex-1" data-i18n="auth.register.type.partner">Channel partner</button>
        </div>

        <form id="registerForm" novalidate>
          <p class="text-muted text-sm mb-3" data-i18n="auth.register.otp.hint">No password needed — we'll email you a code to create your account.</p>
          <div class="form-group">
            <label for="email" data-i18n="auth.email">Email address</label>
            <input type="email" id="email" name="email" inputmode="email" autocomplete="email" placeholder="you@example.com" required>
          </div>

          <div class="form-group">
            <label for="phone" data-i18n="auth.phone">Mobile number</label>
            <input type="tel" id="phone" name="phone" inputmode="numeric" autocomplete="tel" maxlength="10" placeholder="10-digit mobile number">
          </div>

          <button type="button" class="btn btn-ghost btn-block mb-3" id="sendOtpBtn" data-i18n="auth.otp.send">Send code</button>

          <div class="form-group">
            <label for="otpCode" data-i18n="auth.otp.label">Enter the 6-digit code</label>
            <input type="text" id="otpCode" name="otpCode" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="••••••">
          </div>

          <button type="submit" class="btn btn-primary btn-block mb-3" data-i18n="auth.register.verifySignup">Verify &amp; create account</button>
        </form>

        <p class="text-center mb-0">
          <span data-i18n="auth.register.footer">Already have an account?</span>
          <a href="/login" data-i18n="nav.login">Log in</a>
        </p>
      </div>
    </div>
  </div>

  <script src="/js/services/storage.js"></script>
  <script src="/js/services/theme.js"></script>
  <script src="/js/i18n/translations.js"></script>
  <script src="/js/services/i18n.js"></script>
  <script src="/js/services/notifications.js"></script>
  <script src="/js/services/validation.js"></script>
  <script src="/js/data/questions.js"></script>
  <script src="/js/data/schemes.js"></script>
  <script src="/js/services/matching.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/components/navbar.js"></script>
  <script src="/js/components/footer.js"></script>
  <script src="/js/components/progress-ring.js"></script>
  <script src="/js/components/scheme-card.js"></script>
  <script src="/js/components/match-badge.js"></script>
  <script src="/js/components/modal.js"></script>
  <script src="/js/pages/register.js"></script>
</body>
</html>
